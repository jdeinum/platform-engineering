name: Bicep What-If

on:
  pull_request:
    paths:
      - '**/*.bicep'
      - '**/*.bicepparam'
      - '.github/workflows/bicep-whatif.yaml'

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RG }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  whatif:
    name: What-If Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Bicep What-If Analysis
        id: whatif
        run: |
          # Find main .bicep files and run what-if analysis
          find . -name "*.bicep" -type f | while read file; do
            echo "=== What-If Analysis for $file ==="
            az deployment group what-if \
              --resource-group $AZURE_RESOURCE_GROUP \
              --template-file "$file" \
              --parameters @parameters.json \
              --result-format FullResourcePayloads || true
            echo ""
          done > whatif_output.txt

      - name: Comment What-If Results
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const whatif = fs.readFileSync('whatif_output.txt', 'utf8');
            const maxLength = 65000;
            const truncatedWhatif = whatif.length > maxLength ?
              whatif.substring(0, maxLength) + '\n\n... (truncated)' : whatif;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Bicep What-If Analysis\n\`\`\`\n${truncatedWhatif}\n\`\`\``
            });

      - name: Cost Estimation
        run: |
          echo "💰 For cost estimation, consider using Azure Cost Management APIs"
          echo "or third-party tools like Infracost (limited Bicep support)"