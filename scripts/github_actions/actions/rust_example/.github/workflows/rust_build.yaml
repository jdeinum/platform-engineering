permissions:
  contents: read
  checks: write
on:
  push:
    tags:
      - "v*.*.*"

name: upload
jobs:
  check:
    uses: ./.github/workflows/rust_check.yaml
  test:
    uses: ./.github/workflows/rust_test.yaml
  audit:
    uses: ./.github/workflows/rust_audit.yaml
  upload:
    needs: [audit, check, test]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract package version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
          fi

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Build image
        run: |
          docker build -t ${{ secrets.REGISTRY_URL }}/backend:${{ steps.tag.outputs.IMAGE_TAG }} --label "package_version=${{ steps.version.outputs.PACKAGE_VERSION }}" .

      - name: Push image
        run: |
          docker push ${{ secrets.REGISTRY_URL }}/backend:${{ steps.tag.outputs.IMAGE_TAG }}
