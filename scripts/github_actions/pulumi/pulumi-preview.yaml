name: Pulumi Preview

on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.ts'
      - '**/*.js'
      - '**/*.go'
      - '**/*.cs'
      - 'Pulumi.*.yaml'
      - '.github/workflows/pulumi-preview.yaml'

env:
  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

jobs:
  preview:
    name: Preview Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f go.mod ]; then
            go mod download
          fi
          if [ -f *.csproj ]; then
            dotnet restore
          fi

      - name: Pulumi Preview
        id: preview
        run: |
          pulumi stack select dev || pulumi stack init dev
          pulumi refresh --yes --skip-preview || echo "Refresh completed"

          # Run preview and capture output
          pulumi preview --diff --json > preview_output.json 2>&1 || true
          pulumi preview --diff > preview_output.txt 2>&1 || true

      - name: Comment Preview Results
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            let preview = '';
            try {
              preview = fs.readFileSync('preview_output.txt', 'utf8');
            } catch (error) {
              preview = 'Preview output not available';
            }

            const maxLength = 65000;
            const truncatedPreview = preview.length > maxLength ?
              preview.substring(0, maxLength) + '\n\n... (truncated)' : preview;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Pulumi Preview\n\`\`\`\n${truncatedPreview}\n\`\`\``
            });

      - name: Infracost for Pulumi
        run: |
          # Install Infracost
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh

          # Generate cost estimate if supported
          if command -v infracost &> /dev/null; then
            echo "🔍 Generating cost estimate..."
            infracost breakdown --path . --format json --out-file infracost.json || echo "Cost estimation not available for this Pulumi configuration"
          fi

      - name: Policy as Code Validation
        run: |
          # Run Pulumi policy validation if policies exist
          if [ -d "policy" ] || [ -f "PulumiPolicy.yaml" ]; then
            echo "Running policy validation..."
            pulumi preview --policy-pack policy/ || echo "Policy validation completed"
          else
            echo "No policies found to validate"
          fi